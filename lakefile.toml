name = "strong-coupling-lattice-yang-mills"
version = "0.1.0"
keywords = ["math", "formalization", "lattice-gauge-theory", "yang-mills"]
defaultTargets = ["YangMills"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Many theorem families deliberately retain a uniform ambient context.  Keep
# those public signatures stable while enabling the remaining Mathlib lints.
linter.unusedSectionVars = false
linter.unusedDecidableInType = false
linter.unusedFintypeInType = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[require]]
name = "LGT"
git = "https://github.com/mrdouglasny/lgt.git"
rev = "b8793ccf6a51e00e9e2b1685ba191b8626e37137"

[[lean_lib]]
name = "YangMills"
